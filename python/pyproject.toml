[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada-core"
version = "0.1.0"
license = "MIT"
description = "Audio Dynamics Analyzer: BS.1770 / EBU R128 loudness, true peak, PSR and PLR"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "rich>=13.0",
    "matplotlib>=3.7",
    "av>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "psutil>=5.9"]

[project.scripts]
ada-scan = "ada_core.scanner:main"
ada-plot = "ada_core.visualizer:main"

[tool.hatch.build.targets.wheel]
packages = ["ada_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "ebu_files: needs the EBU loudness test set in tests/fixtures/ebu (see tools/fetch_ebu_testset.py)",
    "slow: long-running resource tests (ADA-MEM, ADA-PERF); run with -m slow",
]
