# Builds the Windows VST3 and standalone app, runs all tests and, for a version tag (v0.1.0),
# publishes a GitHub release with a zip. For a test build without a release, run it by hand
# (Actions tab) or push a branch named ci/...; the zip is then attached to the run as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]   # test builds: push a branch named ci/... (no release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Python package and CMake
        run: pip install -e "python[dev,cpp]"

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(AudioDynamicsAnalyzer VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match the CMake version $v" }

      - name: Configure
        run: cmake -B build -S . -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Python tests
        run: |
          $out = pytest python/tests -q --tb=short -k "not m4a_file and not m4a_broken and not m4a_pns" 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code) { $out | Select-String -Pattern '^(FAILED|E  )' | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line)" } }
          exit $code

      # M4A parity needs Windows' Media Foundation with its AAC decoder, which server images may
      # lack. Probe by opening a small AAC file with ada_file_cli; where that works, the tests must
      # pass, otherwise they are skipped with a warning that carries the reader's message.
      # M4A parity needs Windows' Media Foundation with its AAC decoder, which server images may
      # lack. The probe opens a small AAC file and reports (as annotations) whether that works and
      # how it lines up with FFmpeg; where it works, the M4A tests must pass.
      - name: Probe Media Foundation (AAC decoding)
        id: mf
        run: python python/tools/probe_media_foundation.py

      - name: Python M4A parity tests (Media Foundation)
        if: steps.mf.outputs.available == 'true'
        run: |
          $out = pytest python/tests/test_parity.py -q --tb=short -k "m4a" 2>&1
          $code = $LASTEXITCODE
          $out
          # failures as annotations: readable on the run page without signing in
          if ($code) { $out | Select-String -Pattern '^(FAILED|E  )' | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line)" } }
          exit $code

      - name: Package
        id: package
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev-$("${{ github.sha }}".Substring(0, 7))" }
          $name = "AudioDynamicsAnalyzer-$version-windows-x64"
          $artefacts = "build/src/plugin/AudioDynamicsAnalyzer_artefacts/Release"
          $exe = "$artefacts/Standalone/Audio Dynamics Analyzer.exe"
          $vst3 = "$artefacts/VST3/Audio Dynamics Analyzer.vst3/Contents/x86_64-win/Audio Dynamics Analyzer.vst3"
          # the binaries must not need the Visual C++ redistributable (static runtime)
          foreach ($binary in $exe, $vst3) {
            foreach ($dll in "VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "MSVCP140.dll") {
              if (Select-String -LiteralPath $binary -Pattern $dll -SimpleMatch -Quiet) { throw "$binary depends on $dll" }
            }
          }
          $out = "dist/$name"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse "$artefacts/VST3/Audio Dynamics Analyzer.vst3" $out
          Copy-Item $exe $out
          Copy-Item packaging/INSTALL.txt, LICENSE $out
          # the binaries are AGPLv3 (open-source JUCE): ship the license text and JUCE's terms
          Copy-Item packaging/LICENSE-AGPL-3.0.txt $out  # gnu.org text, kept in the repo: the runner cannot always reach gnu.org
          Copy-Item build/_deps/juce-src/LICENSE.md "$out/LICENSE-JUCE.md"
          Compress-Archive -Path $out -DestinationPath "dist/$name.zip"
          "zip=dist/$name.zip" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Audio Dynamics Analyzer ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}
